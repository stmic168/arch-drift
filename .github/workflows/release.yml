name: release

# Push a tag vX.Y.Z on main to publish a release: tests run, binaries for
# Linux, macOS and Windows are built with the version embedded, and a GitHub
# release is created with the binaries, SHA-256 checksums and the CHANGELOG
# section for the tag as notes.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # create the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag must be vX.Y.Z: $TAG"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$TAG is not on main"; exit 1; }
          grep -q "^## $TAG " CHANGELOG.md || { echo "::error::CHANGELOG.md has no section '## $TAG ...'"; exit 1; }
      - name: Vet and test
        run: go vet ./... && go test -count=1 ./...
      - name: Build
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"; arch="${target#*/}"
            name="archdrift_${TAG#v}_${os}_${arch}"
            bin=archdrift; [ "$os" = windows ] && bin=archdrift.exe
            mkdir -p "build/$name"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=$TAG" -o "build/$name/$bin" ./cmd/archdrift
            cp README.md LICENSE "build/$name/"
            if [ "$os" = windows ]; then
              (cd build && zip -qr "../dist/$name.zip" "$name")
            else
              tar -C build -czf "dist/$name.tar.gz" "$name"
            fi
          done
          (cd dist && sha256sum * > checksums.txt)
          ls -l dist
          v="$(build/archdrift_${TAG#v}_linux_amd64/archdrift version)"
          [ "$v" = "archdrift $TAG" ] || { echo "::error::built binary reports '$v'"; exit 1; }
      - name: Release notes
        env:
          TAG: ${{ github.ref_name }}
        run: awk -v tag="$TAG" '$0 ~ "^## " tag " " {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md && cat notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --verify-tag --title "archdrift $TAG" --notes-file notes.md
