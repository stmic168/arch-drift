name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -count=1 ./...
      - name: Offline run on fixture (expects exit 1 = drift found)
        run: |
          set +e
          go run ./cmd/archdrift check --repo testdata/shop --doc testdata/shop/design.md \
            --doc-model testdata/shop/docmodel.json --out out
          code=$?
          set -e
          echo "exit code: $code"
          test "$code" -eq 1
