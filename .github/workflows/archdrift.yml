# Generated by archdrift init. Checks pull requests against the design doc;
# only drift a pull request introduces or worsens fails the check.
name: architecture

on:
  pull_request:

permissions:
  contents: read
  security-events: write # upload-sarif: findings on the changed lines

jobs:
  archdrift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # This repository uses its own action from the checked-out source.
      - uses: ./
        with:
          repo-path: .
          docs: docs/architecture-rules.md
          upload-sarif: "true"
          # Only needed without a committed lock next to the doc:
          # anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
