# Pilot archdrift on a public Go repository: shallow-clone it, extract and lock
# the doc model with the real API, run check, and print everything to the log.
# Manual only (it costs API tokens). Needs the repository secret ANTHROPIC_API_KEY.
# Only the doc text and component IDs are sent to the API, never source code.
name: pilot

on:
  workflow_dispatch:
    inputs:
      repo:
        description: Public GitHub repository (owner/name)
        required: true
      ref:
        description: Branch or tag to check out (empty = default branch)
        required: false
        default: ""
      doc:
        description: Path(s) of the design doc inside that repository, comma-separated for several files
        required: false
        default: ""
      local_docs:
        description: Extra doc(s) from this repository, comma-separated, each pilot/docs/<name>.md (e.g. a rules ADR written for the pilot)
        required: false
        default: ""
      config:
        description: Optional archdrift config in this repository (e.g. pilot/temporal.json)
        required: false
        default: ""
      model:
        description: Claude model for doc extraction
        required: false
        default: claude-sonnet-5-5

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      REPO: ${{ inputs.repo }}
      REF: ${{ inputs.ref }}
      DOC: ${{ inputs.doc }}
      LOCAL_DOCS: ${{ inputs.local_docs }}
      CONFIG: ${{ inputs.config }}
      MODEL: ${{ inputs.model }}
    steps:
      - name: Validate inputs
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Repository secret ANTHROPIC_API_KEY is not set."; exit 1
          fi
          [[ "$REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "::error::repo must be owner/name"; exit 1; }
          [[ -z "$REF" || "$REF" =~ ^[A-Za-z0-9_./-]+$ ]] || { echo "::error::invalid ref"; exit 1; }
          [[ -n "$DOC" || -n "$LOCAL_DOCS" ]] || { echo "::error::give doc and/or local_docs"; exit 1; }
          if [ -n "$DOC" ]; then
            IFS=',' read -ra docs <<< "$DOC"
            for d in "${docs[@]}"; do
              [[ -n "$d" && "$d" != /* && "$d" != *..* && "$d" =~ ^[A-Za-z0-9_./-]+$ ]] || { echo "::error::doc paths must be relative paths inside the repo: $d"; exit 1; }
            done
          fi
          if [ -n "$LOCAL_DOCS" ]; then
            IFS=',' read -ra ldocs <<< "$LOCAL_DOCS"
            for d in "${ldocs[@]}"; do
              [[ "$d" =~ ^pilot/docs/[A-Za-z0-9_.-]+\.md$ && "$d" != *..* ]] || { echo "::error::local_docs must be pilot/docs/<name>.md: $d"; exit 1; }
            done
          fi
          [[ -z "$CONFIG" || ( "$CONFIG" == pilot/*.json && "$CONFIG" != *..* ) ]] || { echo "::error::config must be pilot/<name>.json"; exit 1; }

      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        run: go build -o archdrift ./cmd/archdrift

      - name: Clone target
        run: |
          if [ -n "$REF" ]; then
            git clone --depth 1 --branch "$REF" "https://github.com/$REPO" target
          else
            git clone --depth 1 "https://github.com/$REPO" target
          fi
          echo "target: $REPO @ $(git -C target rev-parse HEAD)"
          if [ -n "$DOC" ]; then
            IFS=',' read -ra docs <<< "$DOC"
            for d in "${docs[@]}"; do
              test -f "target/$d" || { echo "::error::doc not found: $d"; exit 1; }
            done
          fi

      - name: Scan
        run: |
          mkdir -p out
          args=(--repo target); [ -n "$CONFIG" ] && args+=(--config "$CONFIG")
          ./archdrift scan "${args[@]}" | tee out/scan.txt

      - name: Lock (calls the API once)
        run: |
          args=(--repo target --lock out/doc.lock.json --out out --model "$MODEL")
          if [ -n "$DOC" ]; then IFS=',' read -ra docs <<< "$DOC"; for d in "${docs[@]}"; do args+=(--doc "target/$d"); done; fi
          if [ -n "$LOCAL_DOCS" ]; then IFS=',' read -ra ldocs <<< "$LOCAL_DOCS"; for d in "${ldocs[@]}"; do args+=(--doc "$d"); done; fi
          [ -n "$CONFIG" ] && args+=(--config "$CONFIG")
          ./archdrift lock "${args[@]}" | tee out/lock-review.txt

      - name: Check (reads the lock, no API call)
        run: |
          args=(--repo target --lock out/doc.lock.json --out out)
          if [ -n "$DOC" ]; then IFS=',' read -ra docs <<< "$DOC"; for d in "${docs[@]}"; do args+=(--doc "target/$d"); done; fi
          if [ -n "$LOCAL_DOCS" ]; then IFS=',' read -ra ldocs <<< "$LOCAL_DOCS"; for d in "${ldocs[@]}"; do args+=(--doc "$d"); done; fi
          [ -n "$CONFIG" ] && args+=(--config "$CONFIG")
          set +e
          ./archdrift check "${args[@]}"
          code=$?
          set -e
          echo "exit code: $code"
          test "$code" -ne 2

      - name: Print lock (to replay this run offline)
        run: cat out/doc.lock.json

      - name: Print findings
        run: |
          jq '{summary, notes, coverage: .code_model.coverage, usage: (.usage | {source, model, input_tokens, output_tokens}),
               findings: [.findings[] | {type, severity, failing, subject, from, to, protocol, via, message, doc_file,
                 code: [(.code_evidence // [])[] | "\(.file):\(.line)"], doc_quote}],
               dropped_claims}' out/report.json

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Pilot: \`$REPO\` (\`$DOC\` \`$LOCAL_DOCS\`)"
            echo
            if [ -f out/lock-review.txt ]; then echo '```'; cat out/lock-review.txt; echo '```'; fi
            if [ -f out/report.md ]; then cat out/report.md; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: archdrift-pilot
          path: out/
          if-no-files-found: ignore
